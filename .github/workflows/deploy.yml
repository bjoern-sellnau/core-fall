name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two deploys at once — concurrent force-pushes to gh-pages
# race and get rejected ("cannot lock ref").
concurrency:
  group: corefall-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/core-fall/

      - name: Push to gh-pages branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bjoern-sellnau/core-fall.git"
          for i in 1 2 3; do
            git push -f "$REMOTE" HEAD:gh-pages && exit 0
            echo "push failed (attempt $i), retrying in 5s..."
            sleep 5
          done
          exit 1
